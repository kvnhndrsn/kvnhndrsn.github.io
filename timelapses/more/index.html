    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-color: #000 !important;
            --text-color: #fff !important;
            --accent-color: #555 !important;
            --border-color: #333 !important;
           --bar-bg: rgba(10, 10, 10, 0.45);

        html, body {
            background-color: #000 !important;
            background-image: url("/assets/wallpapers/back2-dark.png") !important;
            background-attachment: fixed !important;
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
        }

        body {
            color: var(--text-color);
            font-family: sans-serif;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 72px; /* Space for fixed taskbar */
        }

        main {
            flex: 1;
            padding: 2rem 5vw;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        /* --- SYSTEM BAR (TASKBAR) --- */
        .system-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 72px;
            background: var(--bar-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            z-index: 10000;
            overflow: visible; /* Required for sub-menus */
        }

        .system-tray {
            display: flex;
            align-items: center;
            gap: 1.0vw;
        }

        .task-item {
            position: relative;
            display: flex;
            align-items: center;
        }

        .task-button {
            background: transparent;
            border: none;
            color: #eee;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s;
        }

        .task-button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* --- POPUP MENUS --- */
        .popup-menu {
            position: absolute;
            bottom: 72px;
            left: 0;
            background: #111111dd;
            border: 1px solid #444;
            display: none;
            flex-direction: column;
            min-width: 300px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.8);
            overflow: visible !important;
        }

        .popup-menu.right-aligned {
            left: auto;
            right: 0;
        }

        .popup-menu a, .has-submenu > span {
            padding: 26px 14px;
            color: #ccc;
            text-decoration: none;
            font-size: 1.8rem;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .popup-menu a:hover, .has-submenu:hover > span {
            background: #222;
            color: #fff;
        }

        .menu-icon {
            width: 54px;
            height: 54px;
            filter: invert(1);
            opacity: 0.7;
        }

        .social-menu-icon {
            width: 26px;
            height: 26px;
            filter: invert(1);
            opacity: 0.7;
        }

        /* --- NESTED SUB-MENUS --- */
        .has-submenu {
            position: relative;
        }

        .submenu {
            position: absolute;
            top: 0;
            right: 100%; /* Fly out to the LEFT */
            background: #181818;
            border: 1px solid #444;
            display: none;
            flex-direction: column;
            min-width: 180px;
            z-index: 10001;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
        }

        .has-submenu:hover > .submenu {
            display: flex;
        }

        .has-submenu > span::after {
            content: " <";
            margin-left: auto;
            opacity: 0.5;
        }

    </style>

    <script>
        function toggleMenu(event, menuId) {
            event.stopPropagation();
            const targetMenu = document.getElementById(menuId);
            const isAlreadyOpen = targetMenu.style.display === 'flex';

            // Close all menus
            document.querySelectorAll('.popup-menu').forEach(menu => {
                menu.style.display = 'none';
            });

            // Open clicked menu
            targetMenu.style.display = isAlreadyOpen ? 'none' : 'flex';
        }

        // Global click listener to close menus when clicking outside
        window.onclick = function(event) {
            if (!event.target.matches('.task-button')) {
                document.querySelectorAll('.popup-menu').forEach(menu => {
                    menu.style.display = 'none';
                });
            }
        };
    </script>
